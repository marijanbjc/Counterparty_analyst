app_host: 0.0.0.0
app_port: 8000
app_debug: false

postgres_host: localhost
postgres_port: 5432
postgres_db: contractors
postgres_user: postgres
postgres_password: ""

snapshot_path: docs/internal_files/contractors_audit.snapshot.json

llm_base_url: https://api.groq.com/openai/v1
llm_model: openai/gpt-oss-120b
llm_api_key: ""
llm_timeout_seconds: 60
llm_max_retries: 2
# Минутное окно ключа поставщика. Ключей может быть два — бесплатный и платный,
# поэтому лимит принадлежит профилю, а не приложению (known_issues.md §8).
# Платного ключа сейчас нет, значения совпадают.
llm_tpm_limit_free: 8000
llm_tpm_limit_paid: 8000

auth_login: admin
auth_password: ""
auth_token_ttl_hours: 24
auth_token_secret: dev-insecure-secret-change-in-env

cors_origins:
  - http://localhost:5173
  - http://127.0.0.1:5173

# Потолок ОДНОГО запроса, не минутный лимит: TPM живёт в llm_tpm_limit.
context_token_budget: 30000
context_anchor_max_contractors: 5
# Сколько реплик поднимаем из БД перед обрезкой по бюджету. Обрезает окно бюджет,
# а не это число: ключ ограничивает объём выборки, а не длину контекста.
context_history_max_messages: 40

risk_active_execproc_revenue_share: 0.05
risk_active_execproc_absolute: 10000000
risk_active_execproc_count_without_revenue: 10
risk_negative_factors_threshold: 3
risk_many_execproc_threshold: 100

zsk_mask_yellow_red: false
llm_validator_enabled: false

tariff_default: free
# 0 — без ограничения (profiles.UNLIMITED). Вход в приложение один и общий,
# поэтому квота упиралась в демонстрационный аккаунт, а не в клиента.
tariff_free_requests_limit: 0
tariff_paid_requests_limit: 500
# Один набор за ход: два не помещаются в бюджет и дорогой отсекался постфактум.
tariff_free_max_buttons: 1
tariff_paid_max_buttons: 6
tariff_free_max_compare: 3
tariff_paid_max_compare: 10
# Ход и так съедает минутное окно целиком (запрос + ответ ≈ 7,4 тыс. из 8 тыс.),
# поэтому доля поднята: на числе ходов в минуту это не сказывается.
context_budget_share: 0.8

# Замеры по всей базе, p90 — не медиана: бюджет должен сходиться и на тяжёлых
# контрагентах, иначе набор кнопки отсекается уже после расчёта.
# Пересчитывать при изменении состава факт-пакета.
# Нижняя граница, а не оценка: context.build берёт max() с фактическим замером
# самой строки, поэтому здесь стоит САМЫЙ КОРОТКИЙ вариант промпта (уточнение
# без инструментов). Завышенное значение раздувало бы резерв на таких ходах.
# Замеры: уточнение 899–1007, разбор 1305–1413, сравнение 1322–1430.
tokens_system_prompt: 900
tokens_tools_core: 1817
tokens_tools_role: 2826
tokens_tools_all: 4586
tokens_factpack_full: 4501
tokens_factpack_slim: 2330
tokens_chars_per_token: 2.5
tokens_safety_margin: 1.15
# Резервируется лимитером вместе с промптом: record() пишет prompt + completion,
# и без этого слагаемого окно занижается на треть (§6.1). Замерено 516–1218 за ход.
tokens_expected_completion: 1000
